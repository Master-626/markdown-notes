[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markdown-notes"
version = "0.1.0"
description = "A simple Markdown note-taking CLI with tags and search."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Xu Jiaqi", email = "jiaqixu12138@gmail.com" }]
dependencies = ["click>=8.0.0", "rich>=13.0.0"]

[project.scripts]
mnotes = "markdown_notes.cli:main"

[project.urls]
Homepage = "https://github.com/Master-626/markdown-notes"
